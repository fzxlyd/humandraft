<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HumanDraft</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18181b;
        --muted: #5f6368;
        --line: #d7d3ca;
        --paper: #fffdf8;
        --panel: #f4f1e8;
        --accent: #b42318;
        --accent-2: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      header {
        border-bottom: 1px solid var(--line);
        padding: 20px 24px 16px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }

      header p {
        margin: 6px 0 0;
        color: var(--muted);
      }

      main {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
        padding: 20px 24px 28px;
      }

      section {
        min-width: 0;
      }

      .controls {
        border-right: 1px solid var(--line);
        padding-right: 18px;
      }

      label {
        display: block;
        margin: 12px 0 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      textarea,
      select,
      button {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
      }

      textarea,
      select {
        background: #fff;
        color: var(--ink);
        padding: 10px 12px;
      }

      textarea {
        min-height: 108px;
        resize: vertical;
      }

      button {
        margin-top: 12px;
        padding: 10px 12px;
        background: var(--ink);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
      }

      button.secondary {
        background: var(--accent-2);
      }

      button.ghost {
        background: #fff;
        color: var(--ink);
      }

      pre {
        min-height: 520px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 16px;
        font-size: 14px;
      }

      .status {
        min-height: 24px;
        margin-top: 10px;
        color: var(--accent);
        font-size: 13px;
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }

        .controls {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding-right: 0;
          padding-bottom: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>HumanDraft</h1>
      <p>Generate a brief from one line, compose a draft, then audit the AI smell before readers do.</p>
    </header>
    <main>
      <section class="controls">
        <label for="demand">One-line demand</label>
        <textarea id="demand">琦爸酒食，给我故事：骨头汤补钙</textarea>

        <label for="template">Template</label>
        <select id="template">
          <option value="story">Story</option>
          <option value="short-video">Short video</option>
          <option value="public-account">Public account</option>
          <option value="oral-script">Oral script</option>
          <option value="science">Science explainer</option>
        </select>

        <label for="profile">Profile</label>
        <select id="profile">
          <option value="qiba">qiba</option>
          <option value="general">general</option>
          <option value="story">story</option>
          <option value="research">research</option>
        </select>

        <label for="style">Style</label>
        <select id="style">
          <option value="oral">oral</option>
          <option value="plain">plain</option>
          <option value="elevated">elevated</option>
          <option value="taste">taste</option>
        </select>

        <button id="brief">Generate brief</button>
        <button class="secondary" id="compose">Generate draft</button>
        <button class="ghost" id="audit">Audit output</button>
        <button class="ghost" id="gate">Run quality gate</button>
        <div class="status" id="status"></div>
      </section>

      <section>
        <pre id="output"></pre>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let latestBrief = null;

      $("brief").addEventListener("click", async () => {
        const result = await post("/api/brief", formPayload());
        latestBrief = result.brief;
        $("output").textContent = JSON.stringify(result.brief, null, 2);
      });

      $("compose").addEventListener("click", async () => {
        const result = await post("/api/compose", { ...formPayload(), brief: latestBrief });
        $("output").textContent = `${result.draft}\n\n## Audit\n${JSON.stringify(result.audit, null, 2)}`;
      });

      $("audit").addEventListener("click", async () => {
        const result = await post("/api/audit", {
          text: $("output").textContent,
          profile: $("profile").value
        });
        $("output").textContent = result.markdown;
      });

      $("gate").addEventListener("click", async () => {
        const result = await post("/api/gate", {
          text: $("output").textContent,
          profile: $("profile").value
        });
        $("output").textContent = result.markdown;
      });

      function formPayload() {
        return {
          demand: $("demand").value,
          template: $("template").value,
          profile: $("profile").value,
          style: $("style").value
        };
      }

      async function post(path, body) {
        $("status").textContent = "";
        const response = await fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await response.json();
        if (!response.ok || data.error) {
          $("status").textContent = data.error || "Request failed";
          throw new Error(data.error || "Request failed");
        }
        return data;
      }
    </script>
  </body>
</html>
